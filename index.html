<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>臥底讀心術 FLASH V2.9 (iPad Optimized)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --accent: #ffffff; }
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; touch-action: manipulation; }
        .view { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        .active { display: flex; }
        
        /* 針對 iPad 放大 QR Code 容器 */
        #qrcode { 
            background: #fff; 
            padding: 24px; 
            border-radius: 20px; 
            display: flex; 
            justify-content: center; 
            transition: transform 0.3s;
            box-shadow: 0 0 50px rgba(255,255,255,0.1);
        }
        #qrcode img {
            width: 400px !important; /* iPad 上的固定大尺寸 */
            height: 400px !important;
        }

        /* 放大操作按鈕 */
        .giant-btn {
            width: 75vw; height: 75vw; max-width: 500px; max-height: 500px;
            border-radius: 50%; border: 4px solid rgba(255,255,255,0.15);
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, #151515 0%, #000 100%);
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .giant-btn:active { transform: scale(0.92); border-color: #fff; }

        /* 團隊顏色定義 */
        .reveal-team-0 { background: #16a34a !important; color: #000 !important; } 
        .reveal-team-1 { background: #9333ea !important; color: #fff !important; } 
        .reveal-team-2 { background: #ca8a04 !important; color: #000 !important; } 
        .reveal-team-3 { background: #dc2626 !important; color: #fff !important; } 
        .reveal-team-4 { background: #2563eb !important; color: #fff !important; } 
        .reveal-team-5 { background: #ea580c !important; color: #fff !important; } 

        .flash-active { background: #fff !important; }
        .flash-active * { opacity: 0 !important; }
        
        #setup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .dot-online { background: #22c55e; box-shadow: 0 0 15px #22c55e; }

        @keyframes pulse-custom {
            0% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.15); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.1; }
        }
        .animate-pulse-slow { animation: pulse-custom 4s infinite; }
    </style>
</head>
<body>

<div id="setup-overlay">
    <div class="text-white text-6xl mb-6 animate-bounce">⚡</div>
    <p id="status-desc" class="text-xs uppercase tracking-[0.4em] opacity-40">System Linking...</p>
</div>

<!-- 主機端視圖 (iPad Host) -->
<div id="host-view" class="view p-12 justify-between">
    <div class="space-y-10">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-6xl font-black italic tracking-tighter">SPY MIND</h1>
                <p class="text-sm mt-2 opacity-40 tracking-[0.5em]">SERVER TERMINAL V2.9</p>
            </div>
            <div class="text-right">
                <p class="text-xs font-bold opacity-40 mb-1">CONNECTED AGENTS</p>
                <p id="count" class="text-8xl font-mono leading-none">00</p>
            </div>
        </div>
        
        <div class="flex flex-col items-center">
            <div id="qrcode"></div>
            <p class="mt-8 text-xl font-bold opacity-30 tracking-[0.8em]">SCAN TO JOIN</p>
        </div>
    </div>

    <div class="grid grid-cols-1 gap-6 w-full max-w-4xl mx-auto">
        <div id="host-msg" class="text-center py-4 text-sm border border-white/10 rounded-xl uppercase tracking-widest opacity-60">
            等待特務連線...
        </div>
        <div class="grid grid-cols-2 gap-6">
            <button onclick="distributeGroups()" class="py-10 bg-white text-black font-black text-3xl rounded-2xl active:scale-95 transition-transform">發送閃頻訊號</button>
            <button onclick="triggerReveal()" class="py-10 bg-zinc-800 text-white font-black text-3xl rounded-2xl active:bg-red-600 transition-colors">執行全體揭曉</button>
        </div>
        <button onclick="resetGame()" class="py-4 text-xs text-zinc-700 uppercase tracking-[0.5em]">系統重置</button>
    </div>
</div>

<!-- 玩家端視圖 (Player) -->
<div id="player-view" class="view items-center justify-between p-16">
    <div class="text-center w-full">
        <div class="flex items-center justify-center mb-4">
            <span class="status-dot dot-online"></span>
            <p id="p-status" class="text-lg font-bold tracking-[0.3em] opacity-60">CONNECTED</p>
        </div>
        <h2 id="p-instruction" class="text-3xl font-black italic">等待主機發放代碼</h2>
    </div>

    <div class="relative">
        <div id="flash-bg" class="absolute inset-0 rounded-full animate-pulse-slow bg-white/10 scale-150"></div>
        <button id="flash-btn" 
            ontouchstart="handlePress(true)" ontouchend="handlePress(false)" 
            onmousedown="handlePress(true)" onmouseup="handlePress(false)"
            class="giant-btn opacity-20 pointer-events-none relative z-10">
            <span id="btn-text" class="text-sm font-black tracking-[0.3em] opacity-40">SIGNAL LOCKED</span>
        </button>
    </div>

    <div id="id-card" class="hidden text-center scale-150">
        <p class="text-xs font-bold uppercase mb-4 tracking-[0.6em] opacity-70">Identified As</p>
        <div id="team-name" class="text-8xl font-black italic">---</div>
    </div>
    
    <div class="w-full max-w-2xl">
        <div class="h-[4px] bg-zinc-900 w-full rounded-full">
            <div id="p-bar" class="w-0 h-full bg-white transition-all duration-1000 shadow-[0_0_15px_#fff]"></div>
        </div>
        <p class="text-xs text-center mt-6 opacity-20 tracking-widest uppercase">Encrypted Agent Channel</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection, getDocs, writeBatch, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAoHd1FJze2LfNPTp0f2an_yTwSMaKiuP4",
        authDomain: "spy-mind-reading.firebaseapp.com",
        projectId: "spy-mind-reading",
        storageBucket: "spy-mind-reading.firebasestorage.app",
        messagingSenderId: "836432547281",
        appId: "1:836432547281:web:154e9cbc061e6ff82964f0"
    };

    const appId = "spy-game-final";
    let db, auth, uid;
    let mode = new URLSearchParams(window.location.search).get('mode') === 'player' ? 'player' : 'host';
    let currentPattern = [];
    let isFlashing = false;
    let flashTimer = null;

    document.getElementById(mode + '-view').classList.add('active');

    async function init() {
        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            await signInAnonymously(auth);
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    uid = user.uid;
                    document.getElementById('setup-overlay').style.opacity = "0";
                    setTimeout(() => document.getElementById('setup-overlay').style.display = 'none', 500);
                    if (mode === 'host') startHost(); else startPlayer();
                }
            });
        } catch (e) {
            document.getElementById('status-desc').innerText = "LINK FAILED";
        }
    }

    // --- 主機功能 ---
    function startHost() {
        const joinUrl = window.location.href.split('?')[0] + '?mode=player';
        // 放大 QR Code 渲染尺寸
        new QRCode(document.getElementById("qrcode"), { 
            text: joinUrl, 
            width: 400, 
            height: 400,
            correctLevel: QRCode.CorrectLevel.H 
        });

        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'players'), (snap) => {
            document.getElementById('count').innerText = snap.size.toString().padStart(2, '0');
        });

        window.distributeGroups = async () => {
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'players'));
            if (snap.empty) return;
            
            const players = snap.docs.map(d => d.id).sort(() => Math.random() - 0.5);
            const batch = writeBatch(db);
            const patterns = [
                [150, 150], [400, 100], [100, 400], [250, 250], [600, 50], [50, 600]
            ];

            players.forEach((pid, i) => {
                const groupIdx = Math.floor(i / 2);
                batch.update(doc(db, 'artifacts', appId, 'public', 'data', 'players', pid), {
                    pattern: patterns[groupIdx % patterns.length],
                    group: groupIdx,
                    reveal: false
                });
            });
            await batch.commit();
            document.getElementById('host-msg').innerText = "SIGNAL SYNCED TO ALL AGENTS";
        };

        window.triggerReveal = async () => {
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'players'));
            const batch = writeBatch(db);
            snap.docs.forEach(d => batch.update(d.ref, { reveal: true }));
            await batch.commit();
            document.getElementById('host-msg').innerText = "IDENTITY REVEALED";
        };

        window.resetGame = async () => {
            if(!confirm("確定要重置所有特務資料嗎？")) return;
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'players'));
            const batch = writeBatch(db);
            snap.docs.forEach(d => batch.delete(d.ref));
            await batch.commit();
            location.reload();
        };
    }

    // --- 玩家功能 ---
    function startPlayer() {
        const pRef = doc(db, 'artifacts', appId, 'public', 'data', 'players', uid);
        setDoc(pRef, { active: true, lastSeen: Date.now() }, { merge: true });

        onSnapshot(pRef, (snap) => {
            const data = snap.data();
            if (!data) return;

            if (data.pattern && !currentPattern.length) {
                currentPattern = data.pattern;
                document.getElementById('flash-btn').classList.remove('opacity-20', 'pointer-events-none');
                document.getElementById('p-instruction').innerText = "請按住圓鈕感應頻率";
                document.getElementById('btn-text').innerText = "READY TO SENSE";
                document.getElementById('p-bar').style.width = "100%";
                if (navigator.vibrate) navigator.vibrate(200);
            }

            if (data.reveal) {
                const teamIdx = data.group % 6;
                document.getElementById('player-view').className = `view items-center justify-between p-16 active reveal-team-${teamIdx}`;
                document.getElementById('flash-btn').classList.add('hidden');
                document.getElementById('flash-bg').classList.add('hidden');
                document.getElementById('id-card').classList.remove('hidden');
                document.getElementById('team-name').innerText = `TEAM ${(data.group + 1)}`;
                document.getElementById('p-instruction').innerText = "任務開始";
                if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 300]);
            }
        });
    }

    window.handlePress = (isPressed) => {
        if (!currentPattern.length) return;
        isFlashing = isPressed;
        if (isPressed) {
            let step = 0;
            const run = () => {
                if (!isFlashing) return;
                const isBright = step % 2 === 0;
                document.body.classList.toggle('flash-active', isBright);
                if (isBright && navigator.vibrate) navigator.vibrate(50);
                flashTimer = setTimeout(run, currentPattern[step % currentPattern.length]);
                step++;
            };
            run();
        } else {
            clearTimeout(flashTimer);
            document.body.classList.remove('flash-active');
        }
    };

    init();
</script>
</body>
</html>
