<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臥底讀心術 - 巨幕通訊站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 2px solid rgba(56, 189, 248, 0.3); border-radius: 4rem; }
        canvas { position: absolute; inset: 0; z-index: 0; }
        .view-section { position: relative; z-index: 10; width: 100%; height: 100%; display: none; }
        .view-active { display: flex !important; }
        /* 讓按鈕更有物理感 */
        .btn-glow { box-shadow: 0 0 30px rgba(56, 189, 248, 0.4); }
        .btn-glow:active { transform: scale(0.95); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
    </style>
</head>
<body class="flex items-center justify-center">

    <canvas id="radarCanvas"></canvas>

    <!-- 主控端 (Host) - 針對 iPad 巨幕優化 -->
    <div id="host-view" class="view-section flex-col items-center justify-center gap-12 p-12">
        <div class="glass-panel p-16 shadow-2xl w-full max-w-5xl flex flex-col items-center gap-10">
            
            <h1 class="text-8xl font-black text-sky-400 italic tracking-tighter uppercase mb-4">SPY_CODE</h1>
            
            <div class="flex flex-row items-center gap-20">
                <!-- 放大後的 QR Code 區域 -->
                <div class="bg-white p-8 rounded-[3rem] shadow-[0_0_50px_rgba(255,255,255,0.2)]">
                    <div id="qrcode"></div>
                </div>

                <!-- 狀態顯示區域 -->
                <div class="flex flex-col items-start gap-6">
                    <div class="space-y-2">
                        <p class="text-3xl font-bold text-slate-400 uppercase tracking-widest">特務掃描中...</p>
                        <div id="player-count" class="text-7xl font-black text-emerald-400 leading-none">0</div>
                        <p class="text-2xl text-emerald-500/60 font-mono">AGENTS_ONLINE</p>
                    </div>
                </div>
            </div>

            <!-- 控制按鈕最大化 -->
            <div class="flex gap-8 w-full mt-6">
                <button onclick="distributeCodes()" class="btn-glow flex-1 py-10 bg-sky-600 hover:bg-sky-500 rounded-[2.5rem] font-black text-4xl transition-all shadow-xl">
                    發送秘密代碼
                </button>
                <button onclick="resetGame()" class="px-12 py-10 bg-slate-800 rounded-[2.5rem] hover:bg-slate-700 transition-colors text-4xl">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
            
            <p class="text-slate-500 text-xl font-mono opacity-50">STATION_ID: ALPHA_001 // ENCRYPTION: ACTIVE</p>
        </div>
    </div>

    <!-- 玩家端 (Player) - 保持簡潔但按鈕加大 -->
    <div id="player-view" class="view-section flex-col items-center justify-between h-screen w-full p-10">
        <div class="text-center pt-16">
            <h2 id="player-status" class="text-4xl font-bold text-sky-400">已進入通訊站</h2>
            <p id="player-hint" class="text-2xl text-slate-400 mt-4">請等待指揮官發布指令...</p>
        </div>
        
        <button id="vibrate-btn" disabled onclick="handleVibrate()" class="w-80 h-80 rounded-full border-[12px] border-sky-500/20 bg-sky-900/10 flex flex-col items-center justify-center gap-6 transition-all disabled:opacity-20 active:scale-90">
            <i class="fa-solid fa-fingerprint text-9xl text-sky-400"></i>
            <span class="text-3xl font-bold text-sky-300">長按感應</span>
        </button>
        
        <p class="text-slate-500 text-xl italic mb-10">保持沈默，尋找你的夥伴</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Firebase Config (保持不變)
        const firebaseConfig = {
            apiKey: "AIzaSyAoHd1FJze2LfNPTp0f2an_yTwSMaKiuP4",
            authDomain: "spy-mind-reading.firebaseapp.com",
            projectId: "spy-mind-reading",
            storageBucket: "spy-mind-reading.firebasestorage.app",
            messagingSenderId: "836432547281",
            appId: "1:836432547281:web:154e9cbc061e6ff82964f0",
            measurementId: "G-NP5BZF2V6E"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const params = new URLSearchParams(window.location.search);
        const isHost = params.get('mode') !== 'player';
        let myPattern = [];

        async function init() {
            try {
                await signInAnonymously(auth);
                if (isHost) {
                    initHost();
                } else {
                    initPlayer();
                }
                startRadar();
            } catch (e) {
                console.error("Firebase Error:", e);
            }
        }

        function initHost() {
            document.getElementById('host-view').classList.add('view-active');
            const currentPath = window.location.origin + window.location.pathname;
            // QR Code 放大至 380px
            new QRCode(document.getElementById("qrcode"), {
                text: currentPath + "?mode=player",
                width: 380, height: 380
            });

            onSnapshot(collection(db, "players"), (snap) => {
                document.getElementById('player-count').innerText = snap.size;
            });
        }

        async function initPlayer() {
            document.getElementById('player-view').classList.add('view-active');
            const user = auth.currentUser;
            const playerDoc = doc(db, "players", user.uid);
            await setDoc(playerDoc, { pattern: [], joined: true, timestamp: Date.now() });

            onSnapshot(playerDoc, (snap) => {
                const data = snap.data();
                if (data && data.pattern && data.pattern.length > 0) {
                    myPattern = data.pattern;
                    const btn = document.getElementById('vibrate-btn');
                    btn.disabled = false;
                    document.getElementById('player-status').innerText = "代碼解碼成功！";
                    document.getElementById('player-status').className = "text-4xl font-bold text-emerald-400";
                    document.getElementById('player-hint').innerText = "感受秘密節奏。";
                }
            });
        }

        window.distributeCodes = async () => {
            const snap = await getDocs(collection(db, "players"));
            const patterns = [
                [100, 100, 600], // 短短長
                [600, 100, 100], // 長短短
                [100, 500, 100], // 短長短
                [100, 100, 100, 100, 100] // 五連短
            ];
            let i = 0;
            const batchPromises = snap.docs.map(player => {
                return updateDoc(doc(db, "players", player.id), {
                    pattern: patterns[i++ % patterns.length]
                });
            });
            await Promise.all(batchPromises);
            alert("秘密代碼已發送到特務手機！");
        };

        window.handleVibrate = () => {
            if (myPattern.length > 0) {
                if (navigator.vibrate) navigator.vibrate(myPattern);
                const btn = document.getElementById('vibrate-btn');
                btn.style.backgroundColor = "rgba(56, 189, 248, 0.4)";
                setTimeout(() => btn.style.backgroundColor = "transparent", 300);
            }
        };

        window.resetGame = async () => {
            if(!confirm("確定要重置所有特務嗎？")) return;
            const snap = await getDocs(collection(db, "players"));
            const deletePromises = snap.docs.map(p => deleteDoc(doc(db, "players", p.id)));
            await Promise.all(deletePromises);
            location.reload();
        };

        function startRadar() {
            const canvas = document.getElementById('radarCanvas');
            const ctx = canvas.getContext('2d');
            let rot = 0;
            function anim() {
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                const cx = canvas.width/2, cy = canvas.height/2, r = Math.max(canvas.width, canvas.height)/1.5;
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
                const g = ctx.createRadialGradient(0,0,0,0,0,r);
                g.addColorStop(0, 'rgba(56,189,248,0)'); g.addColorStop(1, 'rgba(56,189,248,0.08)');
                ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,0,Math.PI*0.3); ctx.fill();
                ctx.restore(); rot += 0.01; requestAnimationFrame(anim);
            }
            anim();
        }
        init();
    </script>
</body>
</html>
