<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臥底讀心術 - 實戰連線版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 2.5rem; }
        canvas { position: absolute; inset: 0; z-index: 0; }
        .vibrate-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(56, 189, 248, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); } }
        .view-section { position: relative; z-index: 10; width: 100%; display: none; }
        .view-active { display: flex !important; }
        .flash-active { background-color: rgba(56, 189, 248, 0.4) !important; }
    </style>
</head>
<body>

    <canvas id="radarCanvas"></canvas>

    <!-- 主控端 (Host) -->
    <div id="host-view" class="view-section flex-col items-center gap-6 glass-panel p-10 shadow-2xl max-w-xl w-full mx-4 text-center">
        <h1 class="text-5xl font-black text-sky-400 italic tracking-tighter">SPY_CODE</h1>
        <div class="bg-white p-4 rounded-3xl"><div id="qrcode"></div></div>
        <div id="player-count" class="text-3xl font-bold text-emerald-400">正在等待特務... (0)</div>
        <div class="flex gap-4 w-full">
            <button onclick="distributeCodes()" class="flex-1 py-5 bg-sky-600 hover:bg-sky-500 rounded-2xl font-bold text-xl transition-all shadow-lg active:scale-95">發送秘密代碼</button>
            <button onclick="resetGame()" class="px-6 py-5 bg-slate-800 rounded-2xl hover:bg-slate-700 transition-colors"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
        <p class="text-slate-500 text-xs font-mono">FIREBASE_CONNECTED: TRUE</p>
    </div>

    <!-- 玩家端 (Player) -->
    <div id="player-view" class="view-section flex-col items-center justify-between h-screen w-full p-8">
        <div class="text-center pt-10">
            <h2 id="player-status" class="text-2xl font-bold text-sky-400">已進入通訊站</h2>
            <p id="player-hint" class="text-slate-400 mt-2">請等待指揮官發布指令...</p>
        </div>
        <button id="vibrate-btn" disabled onclick="handleVibrate()" class="w-64 h-64 rounded-full border-8 border-sky-500/20 bg-sky-900/10 flex flex-col items-center justify-center gap-4 transition-all disabled:opacity-20 active:scale-90">
            <i class="fa-solid fa-fingerprint text-7xl text-sky-400"></i>
            <span class="text-lg font-bold text-sky-300">長按感受代碼</span>
        </button>
        <p class="text-slate-500 text-sm italic">保持沈默，尋找你的夥伴</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 已填入你截圖中的 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAoHd1FJze2LfNPTp0f2an_yTwSMaKiuP4",
            authDomain: "spy-mind-reading.firebaseapp.com",
            projectId: "spy-mind-reading",
            storageBucket: "spy-mind-reading.firebasestorage.app",
            messagingSenderId: "836432547281",
            appId: "1:836432547281:web:154e9cbc061e6ff82964f0",
            measurementId: "G-NP5BZF2V6E"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const params = new URLSearchParams(window.location.search);
        const isHost = params.get('mode') !== 'player';
        let myPattern = [];

        async function init() {
            try {
                await signInAnonymously(auth);
                if (isHost) {
                    initHost();
                } else {
                    initPlayer();
                }
                startRadar();
            } catch (e) {
                console.error("Firebase Init Error:", e);
                alert("連線失敗，請檢查 Firebase 是否已開啟『匿名登入』功能。");
            }
        }

        function initHost() {
            document.getElementById('host-view').classList.add('view-active');
            const currentPath = window.location.origin + window.location.pathname;
            new QRCode(document.getElementById("qrcode"), {
                text: currentPath + "?mode=player",
                width: 200, height: 200
            });

            onSnapshot(collection(db, "players"), (snap) => {
                document.getElementById('player-count').innerText = `已加入特務：(${snap.size})`;
            });
        }

        async function initPlayer() {
            document.getElementById('player-view').classList.add('view-active');
            const user = auth.currentUser;
            const playerDoc = doc(db, "players", user.uid);
            await setDoc(playerDoc, { pattern: [], joined: true, timestamp: Date.now() });

            onSnapshot(playerDoc, (snap) => {
                const data = snap.data();
                if (data && data.pattern && data.pattern.length > 0) {
                    myPattern = data.pattern;
                    const btn = document.getElementById('vibrate-btn');
                    btn.disabled = false;
                    btn.classList.add('vibrate-pulse');
                    document.getElementById('player-status').innerText = "代碼解碼成功！";
                    document.getElementById('player-status').className = "text-2xl font-bold text-emerald-400";
                    document.getElementById('player-hint').innerText = "點擊按鈕感受秘密節奏。";
                }
            });
        }

        window.distributeCodes = async () => {
            const snap = await getDocs(collection(db, "players"));
            const patterns = [
                [100, 100, 600], // 短短長
                [600, 100, 100], // 長短短
                [100, 500, 100], // 短長短
                [100, 100, 100, 100, 100] // 五連短
            ];
            let i = 0;
            const batchPromises = snap.docs.map(player => {
                return updateDoc(doc(db, "players", player.id), {
                    pattern: patterns[i++ % patterns.length]
                });
            });
            await Promise.all(batchPromises);
        };

        window.handleVibrate = () => {
            if (myPattern.length > 0) {
                if (navigator.vibrate) navigator.vibrate(myPattern);
                const btn = document.getElementById('vibrate-btn');
                btn.classList.add('flash-active');
                setTimeout(() => btn.classList.remove('flash-active'), 500);
            }
        };

        window.resetGame = async () => {
            if(!confirm("確定要重置所有特務代碼嗎？")) return;
            const snap = await getDocs(collection(db, "players"));
            const deletePromises = snap.docs.map(p => deleteDoc(doc(db, "players", p.id)));
            await Promise.all(deletePromises);
            location.reload();
        };

        function startRadar() {
            const canvas = document.getElementById('radarCanvas');
            const ctx = canvas.getContext('2d');
            let rot = 0;
            function anim() {
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                const cx = canvas.width/2, cy = canvas.height/2, r = Math.max(canvas.width, canvas.height)/1.5;
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
                const g = ctx.createRadialGradient(0,0,0,0,0,r);
                g.addColorStop(0, 'rgba(56,189,248,0)'); g.addColorStop(1, 'rgba(56,189,248,0.1)');
                ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,0,Math.PI*0.4); ctx.fill();
                ctx.restore(); rot += 0.01; requestAnimationFrame(anim);
            }
            anim();
        }

        init();
    </script>
</body>
</html>
